<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 English Quiz Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { display: block; width: 100%; padding: 10px; margin: 8px 0; border: none; background: #0088cc; color: white; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #006699; }
    #loading { font-style: italic; color: #666; }
  </style>
</head>
<body>

  <h2>📚 Grade 8 English Tenses Quiz</h2>

  <div class="card">
    <div id="loading">AI က မေးခွန်း ထုတ်ပေးနေပါတယ်... ခဏစောင့်ပါ...</div>
    
    <div id="quiz-box" style="display: none;">
      <h3 id="question-text"></h3>
      <div id="options-box"></div>
    </div>
  </div>

  <script>
    // Telegram Web App initialize လုပ်ခြင်း
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ⚠️ မင်းရဲ့ API Key အသစ်ကို ဒီနေရာမှာ ထည့်ပါ
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

    // AI ဆီက မေးခွန်းတောင်းယူသည့် Function
    async function fetchQuestionFromAI() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('quiz-box').style.display = 'none';

      const prompt = `Generate 1 multiple-choice grammar question on Tenses for Grade 8 English students. 
Return ONLY a valid JSON object without markdown formatting or code blocks:
{
  "question": "The question text with a blank ___",
  "options": ["Option A", "Option B", "Option C", "Option D"],
  "answer": "The exact correct option string"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        
        // JSON ပြောင်းခြင်း
        const quiz = JSON.parse(rawText.trim());
        displayQuestion(quiz);

      } catch (error) {
        console.error("Error fetching quiz:", error);
        document.getElementById('loading').innerText = "မေးခွန်းယူရတာ အဆင်မပြေပါ၊ ပြန်လည် ကြိုးစားကြည့်ပါ။";
      }
    }

    // မေးခွန်းများကို Screen ပေါ်တင်ပြပေးသည့် Function
    function displayQuestion(quiz) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('quiz-box').style.display = 'block';

      document.getElementById('question-text').innerText = quiz.question;
      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      quiz.options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option, quiz.answer);
        optionsBox.appendChild(btn);
      });
    }

    // အဖြေ မှန်/မှား စစ်ဆေးပေးသည့် Function
    function checkAnswer(selectedOption, correctAnswer) {
      if (selectedOption === correctAnswer) {
        alert("အဖြေ မှန်ပါတယ်! 👏");
      } else {
        alert("အဖြေ မှားပါတယ်။ အဖြေမှန်က: " + correctAnswer);
      }
      // အဖြေဖြေပြီးရင် AI မေးခွန်းအသစ် ထပ်တောင်းမည်
      fetchQuestionFromAI();
    }

    // စစချင်း AI မေးခွန်း စတင်တောင်းယူခြင်း
    fetchQuestionFromAI();
  </script>
</body>
</html>
