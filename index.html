<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 English Study Bot</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
      text-align: center;
    }
    #leaderboard-container {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-top: 20px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    #leaderboard-list {
      list-style: none;
      padding: 0;
    }
    #leaderboard-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <h1>📚 Grade 8 English Quiz & Leaderboard</h1>
  <p>မေးခွန်းများဖြေဆိုပြီး အဆင့်ယှဉ်ပြိုင်ကြပါစို့။</p>

  <!-- Quiz ဖြေမယ့်နေရာ (နမူနာခလုတ်) -->
  <button onclick="finishQuiz(50)">Test Score (50 pts ထည့်မည်)</button>

  <!-- Live Leaderboard ဇယားပေါ်မယ့်နေရာ -->
  <div id="leaderboard-container">
    <h3>🏆 Live Leaderboard</h3>
    <ul id="leaderboard-list">
      <!-- Realtime ဖြင့် အဆင့်စာရင်းများ ဝင်ရောက်လာမည် -->
    </ul>
  </div>

  <!-- Firebase နှင့် Telegram ချိတ်ဆက်ခြင်း JavaScript ကုဒ် -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyClv4XqqbYFcRowwpV8StLFWwbjaOx-5gQ",
      authDomain: "study-bot-61a39.firebaseapp.com",
      databaseURL: "https://study-bot-61a39-default-rtdb.firebaseio.com",
      projectId: "study-bot-61a39",
      storageBucket: "study-bot-61a39.firebasestorage.app",
      messagingSenderId: "637683324139",
      appId: "1:637683324139:web:2d1577b62765f331f69aae"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Telegram User အချက်အလက်ရယူခြင်း
    const tg = window.Telegram?.WebApp;
    let userName = "Guest User";
    let userId = "user_" + Math.floor(Math.random() * 10000);

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      userName = tg.initDataUnsafe.user.first_name || "Telegram User";
      userId = "user_" + tg.initDataUnsafe.user.id;
    }

    // Quiz ပြီးဆုံးချိန် အမှတ်ပို့ရန် Function
    window.finishQuiz = function(score) {
      const scoreRef = ref(db, 'leaderboard/' + userId);
      set(scoreRef, {
        name: userName,
        score: score,
        timestamp: Date.now()
      }).then(() => {
        console.log("Score saved successfully!");
        alert("အမှတ်များကို Database သို့ အောင်မြင်စွာ ပို့ပြီးပါပြီ!");
      }).catch((error) => {
        console.error("Error saving score: ", error);
      });
    };

    // Live Leaderboard ဆွဲထုတ်ရန် Function
    const leaderboardRef = ref(db, 'leaderboard');
    onValue(leaderboardRef, (snapshot) => {
      const data = snapshot.val();
      const leaderboardList = document.getElementById('leaderboard-list');
      if (!leaderboardList) return;

      leaderboardList.innerHTML = "";
      
      if (data) {
        let users = Object.values(data);
        users.sort((a, b) => b.score - a.score);

        users.slice(0, 10).forEach((user, index) => {
          let li = document.createElement('li');
          li.innerHTML = `<span>#${index + 1} ${user.name}</span> <b>${user.score} pts</b>`;
          leaderboardList.appendChild(li);
        });
      }
    });
  </script>

</body>
</html>
