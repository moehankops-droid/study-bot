<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 8 English Complete Master</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    .header { background: var(--card-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .stat-badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; }

    .unit-selector { padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #334155; }
    select { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #3b82f6; font-size: 0.95rem; outline: none; }

    .tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--subtext); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; font-size: 0.85rem; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { padding: 15px; display: none; flex-direction: column; flex: 1; }
    .tab-content.active { display: flex; }

    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; }
    .question { font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #f1f5f9; }
    
    .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #334155; background: #0f172a; color: white; margin-bottom: 10px; font-size: 1rem; outline: none; }
    .input-box:focus { border-color: var(--accent); }
    
    .btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn:active { background: var(--accent-hover); }

    .feedback { margin-top: 10px; font-weight: bold; min-height: 25px; }
    .correct { color: var(--success); }
    .wrong { color: var(--danger); }

    .vocab-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
  </style>
</head>

      { unit: "Poem1", eng: "personality", my: "ပင်ကိုစရိုက်" },
      { unit: "Poem1", eng: "rhyming pairs", my: "အသံတူစကားလုံးတွဲများ" },
      { unit: "Poem1", eng: "ends", my: "အဆုံးသတ်သည်" }  ];

    let filteredData = [...vocabData];
    let currentIndex = 0;
    let userXP = parseInt(localStorage.getItem('userXP') || '0');
    let currentQuestionType = 'my_to_eng'; 
    let activeQuestionItem = null;

    document.getElementById('xp').innerText = userXP;
    document.getElementById('rank-xp').innerText = userXP;

    function renderVocab() {
      const box = document.getElementById('vocab-list-box');
      box.innerHTML = '';
      filteredData.forEach(v => {
        box.innerHTML += `<div class="vocab-row"><strong style="color:var(--accent);">${v.eng}</strong><span>${v.my}</span></div>`;
      });
    }

    function changeUnit() {
      const selectedUnit = document.getElementById('unit-select').value;
      if (selectedUnit === 'all') {
        filteredData = [...vocabData];
      } else {
        filteredData = vocabData.filter(v => v.unit === selectedUnit);
      }
      currentIndex = 0;
      renderVocab();
      loadQuestion();
    }

    function filterVocab() {
      const keyword = document.getElementById('search').value.toLowerCase();
      const rows = document.querySelectorAll('.vocab-row');
      rows.forEach(r => {
        r.style.display = r.innerText.toLowerCase().includes(keyword) ? 'flex' : 'none';
      });
    }

    function loadQuestion() {
      if (filteredData.length === 0) {
        document.getElementById('q-word').innerText = "ဒီ သင်ခန်းစာ မှာ စာလုံးမရှိသေးပါ";
        return;
      }
      activeQuestionItem = filteredData[currentIndex];
      currentQuestionType = Math.random() < 0.5 ? 'my_to_eng' : 'eng_to_my';

      document.getElementById('counter').innerText = `Word ${currentIndex + 1} of ${filteredData.length}`;
      
      if (currentQuestionType === 'my_to_eng') {
        document.getElementById('q-word').innerText = `မြန်မာလို: "${activeQuestionItem.my}"\n(အင်္ဂလိပ်လို ဖြေပါ)`;
      } else {
        document.getElementById('q-word').innerText = `English: "${activeQuestionItem.eng}"\n(မြန်မာလို ဖြေပါ)`;
      }

      document.getElementById('ans-single').value = '';
      document.getElementById('feedback').innerText = '';
    }

    function checkAnswer() {
      if (!activeQuestionItem) return;
      const userAns = document.getElementById('ans-single').value.trim().toLowerCase();
      const fb = document.getElementById('feedback');

      let isCorrect = false;

      if (currentQuestionType === 'my_to_eng') {
        if (userAns === activeQuestionItem.eng.toLowerCase()) {
          isCorrect = true;
        }
      } else {
        const correctMy = activeQuestionItem.my.toLowerCase();
        if (userAns.length > 0 && correctMy.includes(userAns)) {
          isCorrect = true;
        }
      }

      if (isCorrect) {
        fb.className = "feedback correct";
        fb.innerText = "✅ မှန်ကန်ပါသည်! +10 XP ရရှိသည်!";
        userXP += 10;
        localStorage.setItem('userXP', userXP);
        document.getElementById('xp').innerText = userXP;
        document.getElementById('rank-xp').innerText = userXP;

        setTimeout(() => {
          currentIndex = (currentIndex + 1) % filteredData.length;
          loadQuestion();
        }, 1200);
      } else {
        fb.className = "feedback wrong";
        fb.innerText = `❌ မှားနေပါသည်! အမှန်မှာ: Eng: ${activeQuestionItem.eng} | My: ${activeQuestionItem.my}`;
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(tabId === 'vocab') document.querySelectorAll('.tab-btn')[0].classList.add('active');
      if(tabId === 'practice') document.querySelectorAll('.tab-btn')[1].classList.add('active');
      if(tabId === 'rank') document.querySelectorAll('.tab-btn')[2].classList.add('active');

      document.getElementById(tabId).classList.add('active');
    }

    renderVocab();
    loadQuestion();
  </script>
</body>
</html>
